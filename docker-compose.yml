services:
  redis:
    image: redis:latest
    container_name: redis-replay
    ports:
      - "6379:6379"
  
  issuer:
    build:
      context: .
      dockerfile: issuer/Dockerfile
    ports:
      - "3001:3001"
  
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - REDIS_HOST=redis
      - ISSUER_URL=http://issuer:3001
      - ORIGIN_URL=http://origin:3003
    depends_on:
      - redis
      - issuer
  
  origin:
    build:
      context: .
      dockerfile: origin/Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - gateway
  
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      - ISSUER_URL=http://issuer:3001
      - GATEWAY_URL=http://gateway:3002
      - ORIGIN_URL=http://origin:3003
    depends_on:
      - issuer
      - gateway
      - origin
