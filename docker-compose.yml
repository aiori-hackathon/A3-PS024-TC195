services:
  redis:
    image: redis:latest
    container_name: redis-replay
    ports:
      - "6379:6379"
  
  issuer:
    build:
      context: .
      dockerfile: issuer/Dockerfile
    ports:
      - "3001:3001"
  
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      - redis
      - issuer
  
  origin:
    build:
      context: .
      dockerfile: origin/Dockerfile
    ports:
      - "3003:3003"
  
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - issuer
      - gateway
      - origin
